meta:
  version: 2025-08-27
  notes:
    - Non-negotiable contract for LuaGeneratorRAG.
    - Guides live in /guides and are retrieved via RAG.
    - Model must return ONLY one JSON object; no prose, no code fences.

prompt_template: |
  Task: Generate a Unity-compatible JSON configuration for either:
    1) An interactive object with Lua scripting (+ optional particle effects), or
    2) A standalone particle effect (no object script).

  HARD RULES (Contract):
  - Output: return ONLY a single JSON object (no markdown/code fences).
  - Top-level keys (required):
      object_name, lua_code, particle_json, param_ui_lua, param_ui_particle, comment, created_at (ISO-8601 UTC)
  - object_name:
    • Must be derived from SceneObjects.name or generateSpots.gameObjectName; else from user prompt.
    • Always UPPERCASE_WITH_UNDERSCORES (e.g., "Baseball Bat" → "BASEBALL_BAT").
    • ABSOLUTELY FORBIDDEN: ids/sessionURLID/GUIDs/timestamp-like strings.
    • If it would duplicate an existing generated object, append "(2)", "(3)" (no IDs).

  - lua_code (Lua 5.3 / MoonSharp-friendly):
    • Must be emitted as a single JSON string.
    • Every line break must be encoded as \n; tabs as \t.
    • All variables GLOBAL (no 'local').
    • Must ALWAYS begin with these helper functions and globals:

        function to_token(name)
          if name == nil then return nil end
          if type(name) ~= "string" then return nil end
          name = string.gsub(name, "^%s+", "")
          name = string.gsub(name, "%s+$", "")
          name = string.gsub(name, "%s+", " ")
          name = string.upper(name)
          name = string.gsub(name, "[- ]+", "_")
          return name
        end

        function safe_get_name(other)
          if other == nil then return nil end
          if type(other) == "string" then return other end
          if other.GetName ~= nil then return other:GetName() end
          if other.GetGameObject ~= nil then
            local go = other:GetGameObject()
            if go ~= nil and go.GetName ~= nil then return go:GetName() end
          end
          return nil
        end

        SELF_NAME_TOKEN = ""

        function start()
          if type(GetGameObjectProxy) == "function" then gameObjectProxy = GetGameObjectProxy() end
          local localName = nil
          if gameObjectProxy ~= nil and gameObjectProxy.GetName ~= nil then
            localName = gameObjectProxy:GetName()
          end
          if localName == nil or localName == "" then
            localName = SELF_NAME_TOKEN
          end
          SELF_NAME_TOKEN = to_token(localName)
        end

    • Must then include:
        – trigger() (always present, safe to call multiple times).
        – onCollisionEnter(other) (must normalize with to_token(safe_get_name(other))).
        – update(deltaTime) optional.
    • All string comparisons must use tokens (UPPERCASE_WITH_UNDERSCORES).
    • No "..." or "…" ellipses.
    • Guard every proxy call (nil & method checks).







  - particle_json (Enhanced V2 + pipeline fields):
      • Use Enhanced V2 modules: main, emission, velocityOverLifetime, colorOverLifetime, sizeOverLifetime, rotationOverLifetime, noise, trails, renderer, collision.
      • startColor MUST be an object "{{ r:number, g:number, b:number, a:number }}".
      • MinMaxCurve MUST be one of:
        "{{mode:Constant, constant:N}}" |
        "{{mode:Curve, curve:[{time:...,value:...}]}}" |
        "{{mode:TwoConstants, constantMin:N, constantMax:N}}" |
        "{{mode:TwoCurves, curveMin:[...], curveMax:[...]}}".
      • Allowed top-level fields: duration, lifetime, startSize, startSpeed, maxParticles, shape, shapeModule.
  - Category guardrails (unless the user explicitly overrides):
      • Fluids (FIRE/SMOKE/WATER/FOAM/STEAM/MIST): main.loop=true; collision.enabled=false.
      • Bursts (EXPLOSION/HIT_SPARK/DUST_PUFF/IMPACT): main.loop=false; emission.bursts single-shot (repeatInterval=0).
      • Trajectory (BULLET_TRAIL/PROJECTILE_TRAIL/FOAM_JET/WATER_JET): main.simulationSpace="World"; collision.enabled=true; collision.sendCollisionMessages=true; collision.attachRelay=true.
  - Param UI:
      • param_ui_lua: entries for all top-level globals (number/bool/string) with key "name"; sensible min/max/default.
      • param_ui_particle: effectName+label+key+type; slider/toggle/dropdown only over UI-safe properties (e.g., main.loop, duration, startSpeed, startSize, lifetime, renderer.renderMode).
  - SceneObjects (read-only transforms):
      • Do NOT move/scale/rotate/apply forces to SceneObjects.
      • Allowed: attach/trigger particle effects; read transform to align effects; trigger on collisions.
      • Always compare by exact SceneObjects.name (never by id).

  Scene Context (injected):
  - Premise: {{premise}}
  - Additional Detail: {{prompt}}
  - "SceneObjects": [{{scene_objects}}]
  - "Virtual Objects in Scene": [{{generate_spots}}]

  Existing Knowledge (RAG excerpts):
  {{existing_objects}}

Final instruction:
- Return ONLY a single JSON object.
- Ensure that:
    • `comment` is always present and descriptive.
    • `comment` must embed parametric UI cues (slider, toggle, dropdown, input box) aligned with param_ui_lua and param_ui_particle.
    • `param_ui_lua` entries are generated ONLY for top-level numeric, boolean, or string globals defined before start(). Do NOT include Unity proxies (e.g., gameObjectProxy, rigidbodyProxy, transformProxy).
    • `param_ui_particle` always includes sliders for duration, startSpeed, startSize, and lifetime unless explicitly excluded in the user prompt.


output_schema: |
  json_object:
    object_name: string
    created_at: string   # ISO-8601 UTC
    lua_code: string
    particle_json:
      - effectName: string
        duration?: number
        lifetime?: number
        startSize?: number
        startSpeed?: number
        maxParticles?: number
        shape?: string
        shapeModule?:
          type: enum["Cone","Sphere","Hemisphere","Box","Circle"]
          angle: number
          radius: number
          arc: number
          position: "{{ x:number, y:number, z:number }}"
        main:
          gravityModifier: number
          simulationSpace: enum["Local","World"]
          scalingMode: enum["Local","Hierarchy","Shape"]
          prewarm: boolean
          playOnAwake: boolean
          duration: number
          startColor: "{{ r:number, g:number, b:number, a:number }}"
          startLifetime: number
          loop: boolean
        emission:
          rateOverTime: number
          rateOverDistance: number
          bursts:
            - time: number
              count: number
              cycleCount: number
              repeatInterval: number
        velocityOverLifetime:
          enabled: boolean
          space: enum["Local","World"]
          x: "{{}}"
          y: "{{}}"
          z: "{{}}"
          orbitalY: number
          speedModifier: "{{}}"
        colorOverLifetime:
          enabled: boolean
          gradient:
            colorKeys: "[{ time:number, color:{ r:number, g:number, b:number, a:number } }]"
            alphaKeys: "[{ time:number, alpha:number }]"
        sizeOverLifetime:
          enabled: boolean
          separateAxes: boolean
          size: "{{}}"
        rotationOverLifetime:
          enabled: boolean
          separateAxes: boolean
          z: "{{}}"
        noise:
          enabled: boolean
          strength: number
          frequency: number
          scrollSpeed: number
          octaveCount: number
          quality: enum["Low","Medium","High"]
        trails:
          enabled: boolean
          lifetime: number
          ratio: number
          dieWithParticles: boolean
        renderer:
          renderMode: enum["Billboard","StretchedBillboard","HorizontalBillboard","VerticalBillboard","Mesh"]
          materialName: string
          sortingFudge: number
        collision:
          enabled: boolean
          type: enum["World","Planes"]
          mode: enum["3D","2D"]
          collidesWithMask?: number
          collidesWithLayers?: [string]
          sendCollisionMessages: boolean
          attachRelay: boolean
          dampen: number
          bounce: number
          lifetimeLoss: number
          minKillSpeed: number
          radiusScale: number
          quality: enum["Low","Medium","High"]
          voxelSize: number
          maxCollisionShapes: number
          enableDynamicColliders: boolean
          multiplyColliderForceByParticleSize: boolean
    param_ui_lua:
      - name: string
        type: enum["Slider","Toggle","Input"]
        min?: number
        max?: number
        default?: number|string|boolean
        options?: [string]
    param_ui_particle:
      - effectName: string
        label: string
        key: string
        type: enum["Slider","Toggle","Dropdown"]
        min?: number
        max?: number
        default?: number|boolean|string
        options?: [string]
    comment: string

validation_checklist:
  - One JSON object only; no markdown fences or prose.
  - created_at present and ISO-8601 UTC.
  - object_name is not ID-shaped and not any known id/sessionURLID.
  - lua_code:
      • contains trigger()
      • contains start() and onCollisionEnter(other)
      • update(deltaTime) optional
      • no 'local' variables
      • no "..." or "…" characters
  - particle_json:
      • is a list
      • every entry has effectName
      • startColor is "{{ r:number, g:number, b:number, a:number }}"
      • MinMaxCurves use "{{mode:Constant, constant:N}}", "{{mode:Curve, curve:[...]}}", "{{mode:TwoConstants, constantMin:N, constantMax:N}}", or "{{mode:TwoCurves, curveMin:[...], curveMax:[...]}}"
      • allowed modules only (main, emission, velocityOverLifetime, colorOverLifetime,
        sizeOverLifetime, rotationOverLifetime, noise, trails, renderer, collision)
      • allowed top-level fields, duration, lifetime, startSize, startSpeed,
        maxParticles, shape, shapeModule
  - If activateEffect("X") is called, a matching effectName exists in particle_json.
  - param_ui_lua:
      • entries correspond to globals
      • correct types (slider/toggle/input)
      • defaults within [min,max]
  - param_ui_particle:
      • each entry has effectName, label, key, type
      • keys are UI-safe
  - SceneObjects:
      • never moved, scaled, rotated, or forced
      • referenced only by name
