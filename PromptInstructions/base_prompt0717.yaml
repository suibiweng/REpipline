prompt_template: |
  Task: Generate a Unity-compatible JSON configuration that defines either:

  1. An interactive object using Lua scripting and optional particle effects, or  
  2. A standalone particle effect with no associated object.

  --

  Scene Context:
  - Premise: {premise}
  - Additional Detail: {prompt}
  - Physical Furniture in Scene: [{furniture}]
  - Virtual Objects in Scene: [{generate_spots}]

  --

  Existing Generated Objects:
  The following virtual or dynamic objects already exist in the scene. Consider their behavior and avoid duplicating effects or interaction logic.
  You may reference them only if they appear in the furniture or generateSpots lists.

  {existing_objects}

  --

  System Setup:
  - All physical objects (furniture) have colliders and rigidbodies and can detect collisions.
  - All objects support Lua scripting using:
    • start(), update(deltaTime), onCollisionEnter(other), trigger()

  --

  Allowed Lua Proxies and Helpers:
  You may use the following registered Lua proxies and helpers:

  - transformProxy: GetPosition(), SetPosition(), Translate(), Rotate()
  - gameObjectProxy: GetName(), SetName(), IsActive(), SetActive()
  - rigidbodyProxy: AddForce(), SetVelocity(), GetVelocity(), SetUseGravity()
  - audioSourceProxy: Play(), Stop(), Pause(), SetVolume(), SetLoop()
  - textProxy: SetText(), GetText(), SetColor()
  - buttonProxy: SetInteractable(), IsInteractable()
  - particleSystemProxy: Play(), Stop(), SetLooping(), IsPlaying()
  - animatorProxy: Play(), SetBool(), SetTrigger()
  - collisionProxy: GetGameObject(), GetContactPoint(), GetRelativeVelocity()

  Additional Helpers:
  - activateEffect("effectName")
  - deactivateEffect()
  - Vector3(x, y, z)
  - Vector2(x, y)
  - Color(r, g, b, a)
  - Quaternion(x, y, z, w)

  --

  Particle Effects:
  Each effect must define:
  - effectName
  - duration
  - startColor (RGBA)
  - startSize
  - startSpeed
  - maxParticles
  - shape
  - emissionRate
  - lifetime

  Optional:
  - velocityOverLifetime
  - colorOverLifetime

  --

  Parametric UI in Comment:
  The `comment` field should include embedded interface cues such as:
    • speed (slider)
    • label (input box)
    • target (dropdown: [Wall, Chair])
    • effect (dropdown: [ExplosionFX, SmokeTrail])

  Describe behaviors naturally, e.g.:
    • “The car moves forward with speed (slider)”
    • “When it collides with target (dropdown: [Wall, Chair]) it activates effect (dropdown: [Explosion])”
    • “The object plays a sound and shows a particle trail”

  These annotations will be parsed to generate runtime UI controls in Unity.

  --

  Particle-Only Effects:
  If the result is purely a visual particle effect (not tied to an object):
  - "object": "EffectName@Effect"
  - "lua_code": "" or empty
  - "particle_json": must still be complete and valid
  - "param_ui_lua": should be omitted
  - "param_ui_particle": may still be included

  --

  Output Format:
  Return valid JSON using only the following keys:

  {{
    "object": "ObjectName or EffectName@Effect",
    "lua_code": "Lua script string (escaped with \\n and \\t for JSON compatibility)",
    "particle_json": [ {{ full ParticleEffectDefinition(s) }} ],
    "param_ui_particle": [ {{ list of UI controls for particles }} ],
    "param_ui_lua": [ {{ list of UI controls for Lua }} ],
    "comment": "Explanation with embedded (slider), (dropdown), etc.",
    "created_at": "YYYY-MM-DDTHH:MM:SS"
  }}

  Do not include markdown, explanations outside the JSON, or multiline Lua code blocks. The "lua_code" must be escaped as a single-line JSON string.
